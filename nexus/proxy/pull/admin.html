<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>STARPT 客户端连接设置</title>
  <style nonce="{{nonce}}">
    :root {
      color-scheme: light;
      --ink: #202a35;
      --muted: #657384;
      --line: #dce3e9;
      --surface: #fff;
      --canvas: #f3f6f8;
      --accent: #186b63;
      --accent-dark: #10564f;
      --accent-soft: #e8f4f1;
      --danger: #a33131;
      --danger-soft: #fff0ef;
      --success: #176344;
      --success-soft: #eaf6ef;
      --radius: 18px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: radial-gradient(ellipse at 12% 0%, #e7f0ee 0, transparent 35rem), var(--canvas);
    }
    button, input, textarea { font: inherit; }
    .shell { width: min(100% - 32px, 920px); margin: 0 auto; padding: 38px 0 52px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-bottom: 26px; }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .mark { display: grid; width: 42px; height: 42px; place-items: center; border-radius: 14px; background: var(--accent); color: #fff; font-size: 13px; font-weight: 800; letter-spacing: .06em; }
    .brand-name { margin: 0; font-size: 15px; font-weight: 750; letter-spacing: .07em; }
    .brand-sub { margin: 3px 0 0; color: var(--muted); font-size: 12px; }


    .intro { margin: 0 0 24px; }
    h1 { margin: 0; font-size: clamp(27px, 4vw, 36px); line-height: 1.2; letter-spacing: -.035em; }
    .lead { max-width: 680px; margin: 11px 0 0; color: var(--muted); font-size: 15px; line-height: 1.7; }
    .card { overflow: hidden; border: 1px solid #e2e8ed; border-radius: var(--radius); background: var(--surface); box-shadow: 0 14px 42px rgb(28 49 63 / .07); }
    .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding: 22px 26px 19px; border-bottom: 1px solid #edf0f3; }
    .card-head h2 { margin: 0; font-size: 16px; letter-spacing: -.01em; }
    .card-head p { margin: 6px 0 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .connection-state { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; white-space: nowrap; }
    .state-dot { width: 8px; height: 8px; border-radius: 50%; background: #a7b1bc; }
    .connection-state[data-state="ok"] { color: var(--success); }
    .connection-state[data-state="ok"] .state-dot { background: #24906d; }
    .connection-state[data-state="error"] { color: var(--danger); }
    .connection-state[data-state="error"] .state-dot { background: #c44e4b; }
    form { padding: 25px 26px 26px; }
    .section + .section { margin-top: 27px; padding-top: 24px; border-top: 1px solid #edf0f3; }
    .section-title { display: flex; align-items: baseline; gap: 9px; margin: 0 0 16px; font-size: 14px; font-weight: 750; }
    .field-grid { display: grid; grid-template-columns: minmax(0, 1fr) 152px; gap: 14px; }
    .field { min-width: 0; }
    label, .label { display: block; margin-bottom: 7px; color: #334150; font-size: 13px; font-weight: 650; }
    .optional { color: #84909b; font-weight: 450; }
    input[type="text"], input[type="number"], input[type="password"], textarea {
      width: 100%; min-height: 44px; border: 1px solid #cfd8df; border-radius: 10px; outline: none; background: #fff; color: var(--ink); padding: 10px 12px; transition: border-color .15s, box-shadow .15s;
    }
    textarea { min-height: 126px; resize: vertical; line-height: 1.5; }
    input:focus-visible, textarea:focus-visible, button:focus-visible, .file-button:focus-within, .radio-card:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgb(24 107 99 / .16); }
    input::placeholder, textarea::placeholder { color: #9aa5af; }
    .hint { margin: 7px 0 0; color: var(--muted); font-size: 12px; line-height: 1.55; }
    .inline-status { min-height: 18px; margin-top: 8px; color: var(--muted); font-size: 12px; }
    .inline-status[data-state="ok"] { color: var(--success); }
    .inline-status[data-state="error"] { color: var(--danger); }
    .token-row { display: grid; grid-template-columns: 1fr; gap: 0; }
    .radio-list { display: grid; gap: 9px; }
    .radio-card { display: flex; align-items: flex-start; gap: 11px; padding: 13px 14px; border: 1px solid var(--line); border-radius: 12px; cursor: pointer; }
    .radio-card:has(input:checked) { border-color: #9fc6bd; background: #f6fbf9; }
    .radio-card input { margin: 2px 0 0; accent-color: var(--accent); }
    .radio-copy { display: block; }
    .radio-copy strong { display: block; color: #334150; font-size: 13px; font-weight: 700; }
    .radio-copy small { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .cert-panel { margin-top: 13px; padding-left: 29px; }
    .upload-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 0 0 12px; }
    .file-input { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; clip-path: inset(50%); }
    .file-button, .button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 0 15px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: #32404e; font-size: 13px; font-weight: 650; cursor: pointer; transition: transform .15s, background .15s, border-color .15s; }
    .file-button:hover, .button:hover { background: #f7f9fa; border-color: #b9c5ce; }
    .button:active, .file-button:active { transform: translateY(1px); }
    .button:disabled { cursor: wait; opacity: .65; }
    .button-primary { border-color: var(--accent); background: var(--accent); color: #fff; }
    .button-primary:hover { border-color: var(--accent-dark); background: var(--accent-dark); }
    .file-name { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
    .cert-meta { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 11px; color: var(--muted); font-size: 12px; }
    .cert-meta strong { color: #43515e; font-weight: 650; }
    .actions { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-top: 25px; padding-top: 21px; border-top: 1px solid #edf0f3; }
    .actions .button-primary { min-width: 145px; }
    .feedback { flex: 1 1 100%; min-height: 22px; margin: 2px 0 0; border-radius: 9px; color: var(--muted); font-size: 13px; line-height: 1.55; }
    .feedback:not(:empty) { padding: 10px 12px; background: #f5f7f8; }
    .feedback[data-state="ok"] { color: var(--success); background: var(--success-soft); }
    .feedback[data-state="error"] { color: var(--danger); background: var(--danger-soft); }
    .feedback[data-state="pending"] { color: #5d6f80; background: #f1f5f8; }
    .footnote { display: flex; gap: 10px; align-items: flex-start; margin: 15px 3px 0; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .footnote-mark { flex: none; display: grid; width: 18px; height: 18px; place-items: center; border: 1px solid #c5d7d3; border-radius: 50%; color: var(--accent); font-size: 11px; font-weight: 750; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    @media (max-width: 640px) {
      .shell { width: min(100% - 22px, 560px); padding: 20px 0 30px; }
      .topbar { margin-bottom: 22px; }
      .mark { width: 38px; height: 38px; }

      .lead { font-size: 14px; }
      .card-head { padding: 18px 17px 16px; }
      form { padding: 20px 17px 19px; }
      .field-grid { grid-template-columns: minmax(0, 1fr) 106px; gap: 10px; }
      .cert-panel { padding-left: 0; }
      .actions { align-items: stretch; }
      .actions .button { flex: 1 1 auto; }
      .feedback { flex-basis: 100%; }
    }
    @media (max-width: 380px) {
      .field-grid { grid-template-columns: 1fr 88px; }
      .connection-state { font-size: 0; }
      .connection-state .state-dot { width: 9px; height: 9px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; } }
    .cert-meta > span { min-width: 0; max-width: 100%; }
    #certificate-fingerprint { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand" aria-label="STARPT 客户端">
        <div class="mark" aria-hidden="true">SP</div>
        <div><p class="brand-name">STARPT</p><p class="brand-sub">媒体处理客户端</p></div>
      </div>
    </header>

    <section class="intro" aria-labelledby="page-title">
      <h1 id="page-title">连接服务端</h1>
      <p class="lead">设置客户端要连接的 STARPT 服务端。保存时会先验证 HTTPS 地址、令牌和证书；只有连接成功后，新配置才会生效。</p>
    </section>

    <section class="card" aria-labelledby="config-title">
      <div class="card-head">
        <div><h2 id="config-title">连接配置</h2></div>
        <div class="connection-state" id="connection-state" data-state="loading" role="status" aria-live="polite"><span class="state-dot" aria-hidden="true"></span><span id="connection-state-label">正在读取配置</span></div>
      </div>
      <form id="config-form" novalidate>
        <section class="section" aria-labelledby="address-heading">
          <h3 class="section-title" id="address-heading">服务端地址</h3>
          <div class="field-grid">
            <div class="field">
              <label for="server-host">IP 地址或域名</label>
              <input id="server-host" name="server-host" type="text" inputmode="url" placeholder="例如 152.136.236.238 或 starpt.example.com" autocomplete="url" spellcheck="false" required aria-describedby="host-hint">
            </div>
            <div class="field">
              <label for="server-port">端口</label>
              <input id="server-port" name="server-port" type="number" inputmode="numeric" min="1" max="65535" step="1" placeholder="28443" required aria-describedby="host-hint">
            </div>
          </div>
          <p class="hint" id="host-hint">客户端通过 HTTPS 访问此地址。只填写主机名或 IP，不要输入协议头或路径。</p>
        </section>

        <section class="section" aria-labelledby="token-heading">
          <h3 class="section-title" id="token-heading">客户端令牌</h3>
          <div class="token-row">
            <div class="field">
              <label for="agent-token">访问令牌 <span class="optional">· 修改地址时必填</span></label>
              <input id="agent-token" name="agent-token" type="password" autocomplete="new-password" placeholder="留空以保留当前令牌" aria-describedby="token-hint">
              <p class="hint" id="token-hint">令牌不会回显。地址不变时留空会继续使用已保存的令牌。</p>
            </div>
          </div>
        </section>

        <section class="section" aria-labelledby="certificate-heading">
          <h3 class="section-title" id="certificate-heading">服务端证书</h3>
          <div class="radio-list" role="radiogroup" aria-label="证书信任方式">
            <label class="radio-card"><input type="radio" name="certificate-mode" value="keep" checked><span class="radio-copy"><strong>保留当前证书设置</strong><small id="current-certificate-label">沿用当前证书；如尚未配置则使用系统信任证书。</small></span></label>
            <label class="radio-card"><input type="radio" name="certificate-mode" value="custom"><span class="radio-copy"><strong>添加或替换 CA 证书</strong><small>上传 PEM 文件或粘贴 PEM 内容。新证书会先用于验证连接。</small></span></label>
            <label class="radio-card"><input type="radio" name="certificate-mode" value="system"><span class="radio-copy"><strong>仅使用系统 CA</strong><small>清除自定义 CA，并按系统证书库验证服务端。</small></span></label>
          </div>
          <div class="cert-panel" id="custom-certificate-panel" hidden>
            <div class="upload-row">
              <label class="file-button" for="certificate-file">选择 PEM 文件</label>
              <input class="file-input" id="certificate-file" type="file" accept=".pem,.crt,.cer,application/x-pem-file,text/plain" aria-describedby="certificate-file-hint">
              <span class="file-name" id="certificate-file-name">尚未选择文件</span>
            </div>
            <p class="hint" id="certificate-file-hint">也可以直接粘贴证书内容；选择文件后以文件内容为准。单个文件不超过 1 MiB。</p>
            <label for="certificate-pem" class="sr-only">PEM 证书内容</label>
            <textarea id="certificate-pem" name="certificate-pem" spellcheck="false" autocomplete="off" placeholder="-----BEGIN CERTIFICATE-----&#10;粘贴 CA 证书 PEM 内容&#10;-----END CERTIFICATE-----"></textarea>
            <p class="inline-status" id="certificate-status" aria-live="polite"></p>
          </div>
          <div class="cert-meta" id="certificate-meta" aria-live="polite">
            <span><strong>当前状态</strong> <span id="certificate-configured">读取中</span></span>
            <span><strong>指纹</strong> <span id="certificate-fingerprint">—</span></span>
            <span><strong>有效期至</strong> <span id="certificate-expires">—</span></span>
          </div>
        </section>

        <div class="actions">
          <button class="button button-primary" id="save-button" type="submit">保存并测试</button>
          <button class="button" id="test-button" type="button">测试当前连接</button>
          <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
        </div>
      </form>
    </section>
    <p class="footnote"><span class="footnote-mark" aria-hidden="true">i</span><span>测试当前连接使用已保存的配置，表单中尚未保存的改动不会参与测试。</span></p>
  </main>

  <script nonce="{{nonce}}">
    (() => {
      'use strict';
      const form = document.getElementById('config-form');
      const hostInput = document.getElementById('server-host');
      const portInput = document.getElementById('server-port');
      const tokenInput = document.getElementById('agent-token');
      const fileInput = document.getElementById('certificate-file');
      const pemInput = document.getElementById('certificate-pem');
      const fileName = document.getElementById('certificate-file-name');
      const certPanel = document.getElementById('custom-certificate-panel');
      const certStatus = document.getElementById('certificate-status');
      const feedback = document.getElementById('feedback');
      const saveButton = document.getElementById('save-button');
      const testButton = document.getElementById('test-button');
      const state = document.getElementById('connection-state');
      const stateLabel = document.getElementById('connection-state-label');
      let savedAddress = '';
      let savedTokenConfigured = false;

      const setFeedback = (message, kind) => {
        feedback.textContent = message || '';
        if (kind) feedback.dataset.state = kind;
        else delete feedback.dataset.state;
      };
      const setConnectionState = (message, kind) => {
        stateLabel.textContent = message;
        state.dataset.state = kind || 'loading';
      };
      const setBusy = (busy, source) => {
        saveButton.disabled = busy;
        testButton.disabled = busy;
        form.querySelectorAll('input, textarea').forEach((control) => { control.disabled = busy; });
        saveButton.textContent = busy && source === 'save' ? '正在验证并保存…' : '保存并测试';
        testButton.textContent = busy && source === 'test' ? '正在测试…' : '测试当前连接';
      };
      const selectedCertificateMode = () => {
        const selected = document.querySelector('input[name="certificate-mode"]:checked');
        return selected ? selected.value : 'keep';
      };
      const parseAddress = (address) => {
        try {
          const parsed = new URL(address);
          return { host: parsed.hostname.replace(/^\[|\]$/g, ''), port: parsed.port || '443' };
        } catch (_) { return { host: '', port: '' }; }
      };
      const currentAddress = () => {
        const host = hostInput.value.trim();
        const port = portInput.value.trim();
        if (!host || !port || /[\s/?#@\\]/.test(host)) return '';
        const bracketed = host.includes(':') && !host.startsWith('[') ? '[' + host + ']' : host;
        try {
          return new URL('https://' + bracketed + ':' + port).origin;
        } catch (_) { return ''; }
      };
      const readableDate = (value) => {
        if (!value) return '—';
        const date = new Date(value);
        return Number.isNaN(date.getTime()) ? String(value) : date.toLocaleString('zh-CN', { dateStyle: 'medium' });
      };
      const showSavedConfig = (config) => {
        savedAddress = typeof config.address === 'string' ? config.address : '';
        savedTokenConfigured = config.token_configured === true;
        const parsed = parseAddress(savedAddress);
        hostInput.value = parsed.host;
        portInput.value = parsed.port;
        document.getElementById('certificate-configured').textContent = config.certificate_configured ? '已配置自定义证书' : '使用系统 CA';
        document.getElementById('certificate-fingerprint').textContent = config.certificate_fingerprint || '—';
        document.getElementById('certificate-expires').textContent = readableDate(config.certificate_expires);
        document.getElementById('current-certificate-label').textContent = config.certificate_configured ? '沿用当前自定义 CA 证书。' : '当前使用系统信任证书。';
      };
      const loadConfig = async () => {
        setBusy(true, 'load');
        try {
          const response = await fetch('/api/config', { credentials: 'same-origin', headers: { 'Accept': 'application/json' } });
          if (!response.ok) throw new Error('读取配置失败（HTTP ' + response.status + '）');
          showSavedConfig(await response.json());
          setConnectionState('配置已读取', '');
          setBusy(false, 'load');
        } catch (error) {
          setConnectionState('无法读取配置', 'error');
          setFeedback(error instanceof Error ? error.message : '读取配置失败，请刷新后重试。', 'error');
        }
      };
      const responseMessage = async (response) => {
        let data = null;
        try { data = await response.json(); } catch (_) { /* Non-JSON error page: show a short fallback. */ }
        if (!response.ok) return { ok: false, message: data && typeof data.message === 'string' ? data.message : '请求失败（HTTP ' + response.status + '）' };
        if (!data || typeof data !== 'object') return { ok: false, message: '服务端返回了无法识别的结果。' };
        return { ok: data.ok === true, message: typeof data.message === 'string' ? data.message : (data.ok === true ? '连接成功。' : '连接失败。'), config: data.config };
      };
      const submitRequest = async (endpoint, body, source) => {
        setBusy(true, source);
        setFeedback(source === 'save' ? '正在验证候选配置，成功后才会保存并启用。' : '正在测试已保存的连接配置。', 'pending');
        setConnectionState(source === 'save' ? '正在验证新配置' : '正在测试连接', 'loading');
        try {
          const response = await fetch(endpoint, {
            method: 'POST',
            credentials: 'same-origin',
            headers: { 'Accept': 'application/json', 'Content-Type': 'application/json', 'X-STARPT-Request': '1' },
            body: JSON.stringify(body)
          });
          const result = await responseMessage(response);
          if (!result.ok) {
            setFeedback(result.message + (source === 'save' ? ' 已保存的配置保持不变。' : ''), 'error');
            setConnectionState(source === 'save' ? '候选连接失败' : '连接失败', 'error');
            return;
          }
          setFeedback(result.message, 'ok');
          setConnectionState('连接正常', 'ok');
          if (source === 'save') {
            if (result.config) showSavedConfig(result.config);
            tokenInput.value = '';
            fileInput.value = '';
            fileName.textContent = '尚未选择文件';
            pemInput.value = '';
            certStatus.textContent = '';
            document.querySelector('input[name="certificate-mode"][value="keep"]').checked = true;
            certPanel.hidden = true;
          }
        } catch (error) {
          const reason = error instanceof Error ? error.message : '网络请求失败';
          setFeedback(reason + (source === 'save' ? ' 请刷新页面核对已保存的配置。' : ''), 'error');
          setConnectionState('无法连接服务端', 'error');
        } finally {
          setBusy(false, source);
        }
      };
      const readCertificate = async () => {
        if (!fileInput.files || fileInput.files.length === 0) return '';
        const file = fileInput.files[0];
        if (file.size > 1024 * 1024) throw new Error('证书文件超过 1 MiB，请选择较小的 PEM 文件。');
        return await file.text();
      };

      document.querySelectorAll('input[name="certificate-mode"]').forEach((radio) => {
        radio.addEventListener('change', () => {
          certPanel.hidden = selectedCertificateMode() !== 'custom';
          certStatus.textContent = '';
          delete certStatus.dataset.state;
        });
      });
      fileInput.addEventListener('change', async () => {
        if (!fileInput.files || fileInput.files.length === 0) {
          fileName.textContent = '尚未选择文件';
          return;
        }
        const file = fileInput.files[0];
        fileName.textContent = file.name;
        try {
          await readCertificate();
          certStatus.textContent = '证书文件已读取，保存时将用它验证连接。';
          certStatus.dataset.state = 'ok';
        } catch (error) {
          fileInput.value = '';
          fileName.textContent = '尚未选择文件';
          certStatus.textContent = error instanceof Error ? error.message : '读取证书文件失败。';
          certStatus.dataset.state = 'error';
        }
      });
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const address = currentAddress();
        const port = Number(portInput.value);
        if (!address || !Number.isInteger(port) || port < 1 || port > 65535) {
          setFeedback('请填写有效的 IP 或域名，以及 1–65535 范围内的端口。', 'error');
          (hostInput.value.trim() ? portInput : hostInput).focus();
          return;
        }
        const changedAddress = address !== savedAddress;
        const token = tokenInput.value;
        if (changedAddress && !token.trim()) {
          setFeedback('服务端地址已更改，请输入新服务端的客户端令牌。', 'error');
          tokenInput.focus();
          return;
        }
        if (!changedAddress && !savedTokenConfigured && !token.trim()) {
          setFeedback('尚未配置客户端令牌，请输入令牌后保存。', 'error');
          tokenInput.focus();
          return;
        }
        const body = { address };
        if (token.trim()) body.token = token;
        const mode = selectedCertificateMode();
        if (mode === 'system') body.use_system_cas = true;
        if (mode === 'custom') {
          try {
            const pem = fileInput.files && fileInput.files.length ? await readCertificate() : pemInput.value.trim();
            if (!pem) {
              setFeedback('请选择 PEM 文件或粘贴证书内容。', 'error');
              pemInput.focus();
              return;
            }
            body.certificate_pem = pem;
          } catch (error) {
            setFeedback(error instanceof Error ? error.message : '读取证书失败。', 'error');
            return;
          }
        }
        await submitRequest('/api/config', body, 'save');
      });
      testButton.addEventListener('click', () => submitRequest('/api/test', {}, 'test'));
      loadConfig();
    })();
  </script>
</body>
</html>
