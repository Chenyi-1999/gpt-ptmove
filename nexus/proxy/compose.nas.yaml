services:
  media-agent:
    image: ptmove-media-agent:0.3.1
    build:
      context: .
      dockerfile: Dockerfile.nas
    restart: unless-stopped
    ports:
      - "${PTMOVE_BIND_IP:-127.0.0.1}:${PTMOVE_PROXY_PORT:-19090}:19090"
    environment:
      PTMOVE_PROXY_TOKEN: ${PTMOVE_PROXY_TOKEN:?Set a random token of at least 32 characters}
      PTMOVE_MEDIA_ROOTS: ${PTMOVE_MEDIA_ROOTS:?Set a JSON array containing the same absolute path as the media mount}
    volumes:
      - type: bind
        source: ${PTMOVE_MEDIA_SOURCE:?Set the NAS media directory}
        target: ${PTMOVE_MEDIA_SOURCE:?Set the NAS media directory}
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777,nosuid,nodev
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 96
    mem_limit: 768m
    cpus: 1.0
